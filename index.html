<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vremenska Prognoza - BiH</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            padding: 24px;
            width: 100%;
            max-width: 480px;
        }
        .header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 { color: #0f172a; font-size: 1.35rem; font-weight: 800; }
        
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        select {
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            cursor: pointer;
            flex-grow: 1;
        }

        .btn-location {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-location:hover { background-color: #1d4ed8; }

        .source-tag {
            font-size: 0.75rem;
            background-color: #2563eb;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .weather-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 5px 0 10px 0;
        }

        .weather-icon-display {
            font-size: 3.5rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .picker-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-align: center;
        }

        .picker-wrapper {
            position: relative;
            height: 120px;
            width: 100%;
            max-width: 180px;
            margin: 0 auto 15px auto;
            overflow: hidden;
            background-color: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .picker-wrapper::before,
        .picker-wrapper::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 40px;
            z-index: 2;
            pointer-events: none;
        }

        .picker-wrapper::before {
            top: 0;
            background: linear-gradient(to bottom, rgba(248,250,252,0.95), rgba(248,250,252,0));
        }

        .picker-wrapper::after {
            bottom: 0;
            background: linear-gradient(to top, rgba(248,250,252,0.95), rgba(248,250,252,0));
        }

        .picker-selection-line {
            position: absolute;
            top: 40px;
            height: 40px;
            left: 8px;
            right: 8px;
            background-color: #2563eb;
            border-radius: 8px;
            z-index: 1;
            opacity: 0.15;
            pointer-events: none;
        }

        .picker-list {
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 40px 0;
        }

        .picker-list::-webkit-scrollbar { display: none; }

        .picker-item {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: #64748b;
            scroll-snap-align: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            z-index: 3;
        }

        .picker-item.active {
            color: #2563eb;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .weather-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .info-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        .info-value { 
            font-size: 1.15rem; 
            font-weight: 800; 
            color: #0f172a; 
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .trend-arrow { font-size: 1.1rem; font-weight: 900; }
        .up { color: #ef4444; }
        .down { color: #2563eb; }
        .neutral { color: #94a3b8; }

        .wind-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
            color: #2563eb;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .wind-dir-text {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 600;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="header-top">
                <h2>Vremenska Prognoza</h2>
                <span class="source-tag">Meteoblue AI</span>
            </div>
            <div class="controls">
                <select id="city-select" onchange="promjeniGrad()">
                    <option value="44.2034,17.9077" selected>Zenica</option>
                    <option value="43.8563,18.4131">Sarajevo</option>
                    <option value="44.7722,17.1910">Banja Luka</option>
                    <option value="44.5384,18.6671">Tuzla</option>
                    <option value="43.3438,17.8078">Mostar</option>
                    <option value="44.8169,15.8708">Bihać</option>
                    <option value="44.7865,16.6681">Sanski Most</option>
                    <option value="44.8708,18.8100">Brčko</option>
                    <option value="44.7570,19.2144">Bijeljina</option>
                    <option value="44.7322,18.0864">Doboj</option>
                    <option value="44.9575,18.2981">Modriča</option>
                    <option value="43.6552,17.9576">Konjic</option>
                    <option value="42.7103,18.3436">Trebinje</option>
                    <option value="43.8333,17.3000">Livno</option>
                    <option value="43.9389,17.6658">Travnik</option>
                    <option value="43.6667,18.9761">Goražde</option>
                    <option value="45.1447,17.2542">Gradiška</option>
                    <option value="44.9667,16.7167">Prijedor</option>
                    <option value="43.6406,17.2736">Tomislavgrad</option>
                    <option value="44.3414,17.2686">Jajce</option>
                    <option value="45.1103,15.8322">Velika Kladuša</option>
                </select>
                <button class="btn-location" onclick="dajMojaLokacija()" title="Moja Lokacija">📍 Lokacija</button>
            </div>
            <div id="error-box" class="error-msg">Greška pri učitavanju podataka.</div>
        </div>

        <div class="weather-display">
            <div id="weather-icon" class="weather-icon-display">☀️</div>
        </div>

        <div class="picker-label">Izaberi Sat</div>
        <div class="picker-wrapper">
            <div class="picker-selection-line"></div>
            <div class="picker-list" id="pickerList" onscroll="handleRollerScroll()"></div>
        </div>

        <div class="weather-info">
            <div class="info-card">
                <div class="info-label">Temperatura</div>
                <div class="info-value">
                    <span id="temp-val">-- °C</span>
                    <span id="temp-arrow" class="trend-arrow neutral">→</span>
                </div>
            </div>
            
            <div class="info-card">
                <div class="info-label">Vjetar i Smjer</div>
                <div class="info-value">
                    <span id="wind-val">-- km/h</span>
                    <span id="wind-arrow" class="wind-arrow">↑</span>
                    <span id="wind-dir" class="wind-dir-text"></span>
                </div>
            </div>

            <div class="info-card">
                <div class="info-label">Pritisak</div>
                <div class="info-value">
                    <span id="pressure-val">-- hPa</span>
                    <span id="pressure-arrow" class="trend-arrow neutral">→</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const METEOBLUE_KEY = "yPfsxREeDl1FVMXj";
        let prognozaPodaci = []; 
        let izabraniIndex = 0;
        let scrollTimeout;

        function dajIkonuVremena(picto) {
            if (picto === 1) return "☀️";
            if (picto === 2 || picto === 3) return "🌤️";
            if (picto >= 4 && picto <= 6) return "☁️";
            if (picto >= 7 && picto <= 11) return "🌧️";
            if (picto >= 12 && picto <= 15) return "⛈️";
            if (picto >= 16) return "❄️";
            return "🌤️";
        }

        function stepeniUSmjer(deg) {
            const strane = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            return strane[Math.round(deg / 45) % 8];
        }

        async function dajPodatke(lat, lon) {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            try {
                const mbUrl = `https://my.meteoblue.com/packages/basic-1h?lat=${lat}&lon=${lon}&apikey=${METEOBLUE_KEY}&format=json`;
                const res = await fetch(mbUrl);
                
                if (!res.ok) throw new Error("API odziv nije ispravan");
                
                const data = await res.json();

                if (data && data.data_1h) {
                    const sada = new Date();
                    const trenutniSat = sada.getHours();

                    prognozaPodaci = data.data_1h.time.map((t, i) => {
                        const satTekst = t.split(' ')[1] || (t.includes('T') ? t.split('T')[1] : t);
                        const satNum = parseInt(satTekst.split(':')[0]);
                        return {
                            vreme: satTekst.substring(0, 5),
                            satNum: satNum,
                            temp: data.data_1h.temperature[i],
                            vjetar: data.data_1h.windspeed[i],
                            smjerVjetra: data.data_1h.winddirection ? data.data_1h.winddirection[i] : 0,
                            pritisak: data.data_1h.sealevelpressure[i],
                            picto: data.data_1h.pictocode ? data.data_1h.pictocode[i] : null
                        };
                    });

                    let idx = prognozaPodaci.findIndex(p => p.satNum === trenutniSat);
                    if (idx === -1) idx = 0;
                    
                    izgradiRollerSati();
                    setTimeout(() => skrolujNaIndex(idx), 100);
                }
            } catch (err) {
                console.error("Greška pri učitavanju:", err);
                errorBox.style.display = 'block';
            }
        }

        function izgradiRollerSati() {
            const list = document.getElementById('pickerList');
            list.innerHTML = '';
            
            prognozaPodaci.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'picker-item';
                el.innerText = item.vreme;
                el.onclick = () => skrolujNaIndex(i);
                list.appendChild(el);
            });
        }

        function skrolujNaIndex(idx) {
            const list = document.getElementById('pickerList');
            const itemHeight = 40;
            list.scrollTo({
                top: idx * itemHeight,
                behavior: 'smooth'
            });
            postaviIndex(idx);
        }

        function handleRollerScroll() {
            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                const list = document.getElementById('pickerList');
                const itemHeight = 40;
                const newIdx = Math.round(list.scrollTop / itemHeight);
                if (newIdx !== izabraniIndex && newIdx >= 0 && newIdx < prognozaPodaci.length) {
                    postaviIndex(newIdx);
                }
            }, 60);
        }

        function postaviIndex(idx) {
            izabraniIndex = idx;
            const list = document.getElementById('pickerList');
            const items = list.children;

            for (let i = 0; i < items.length; i++) {
                if (i === idx) {
                    items[i].classList.add('active');
                } else {
                    items[i].classList.remove('active');
                }
            }

            const podatak = prognozaPodaci[idx];
            const prethodni = prognozaPodaci[idx - 1] || podatak;

            if (podatak) {
                document.getElementById('weather-icon').innerText = dajIkonuVremena(podatak.picto);

                document.getElementById('temp-val').innerText = `${podatak.temp} °C`;
                const tempArrow = document.getElementById('temp-arrow');
                if (podatak.temp > prethodni.temp) {
                    tempArrow.innerText = "↑";
                    tempArrow.className = "trend-arrow up";
                } else if (podatak.temp < prethodni.temp) {
                    tempArrow.innerText = "↓";
                    tempArrow.className = "trend-arrow down";
                } else {
                    tempArrow.innerText = "→";
                    tempArrow.className = "trend-arrow neutral";
                }

                document.getElementById('wind-val').innerText = `${podatak.vjetar} km/h`;
                const windArrow = document.getElementById('wind-arrow');
                const smjerDeg = podatak.smjerVjetra || 0;
                windArrow.style.transform = `rotate(${smjerDeg}deg)`;
                document.getElementById('wind-dir').innerText = `(${stepeniUSmjer(smjerDeg)})`;

                document.getElementById('pressure-val').innerText = `${Math.round(podatak.pritisak)} hPa`;
                const pressureArrow = document.getElementById('pressure-arrow');
                if (podatak.pritisak > prethodni.pritisak) {
                    pressureArrow.innerText = "↑";
                    pressureArrow.className = "trend-arrow up";
                } else if (podatak.pritisak < prethodni.pritisak) {
                    pressureArrow.innerText = "↓";
                    pressureArrow.className = "trend-arrow down";
                } else {
                    pressureArrow.innerText = "→";
                    pressureArrow.className = "trend-arrow neutral";
                }
            }
        }

        function dajMojaLokacija() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(4);
                        const lon = position.coords.longitude.toFixed(4);
                        
                        const select = document.getElementById('city-select');
                        
                        let found = false;
                        for (let i = 0; i < select.options.length; i++) {
                            if (select.options[i].value === `${lat},${lon}`) {
                                select.selectedIndex = i;
                                found = true;
                                break;
                            }
                        }

                        if (!found) {
                            const newOpt = document.createElement('option');
                            newOpt.value = `${lat},${lon}`;
                            newOpt.innerText = "📍 Moja Lokacija";
                            newOpt.selected = true;
                            select.appendChild(newOpt);
                        }

                        dajPodatke(lat, lon);
                    },
                    () => alert("Nije moguće pristupiti lokaciji.")
                );
            } else {
                alert("Geolokacija nije podržana.");
            }
        }

        function promjeniGrad() {
            const select = document.getElementById('city-select');
            const [lat, lon] = select.value.split(',');
            dajPodatke(lat, lon);
        }

        promjeniGrad();
    </script>

</body>
</html>
